[accessibility]
ui_scale = 1.350000012665987

[bar.default]
auto_hide = true
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
reserve_space = false
scale = 1.5500000156462193
start = [ "launcher", "wallpaper", "workspaces", "media" ]
thickness = 64
widget_spacing = 11

[control_center]
hidden_tabs = [ "weather" ]

[idle]
pre_action_fade_seconds = 5

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1018.0
    output = "HDMI-A-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 971.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.54000000000000004
        background_radius = 32.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 14.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = false
        show_media = false
        show_session_buttons = false
        show_unlock_hint = false
        show_weather = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 222.66796875
    box_width = 409.59765625
    cx = 960.0
    cy = 584.666015625
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        clock_style = "digital"

[shell.screenshot]
annotate = true

[theme]
builtin = "Ayu"
community_palette = "Oxocarbon"
custom_palette = "noctalia-wallpaper-mc"
mode = "dark"
pure_black_dark = true
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/azea/MyNixConfig/Wallpaper"

    [wallpaper.default]
    path = "/home/azea/MyNixConfig/Wallpaper/earth_rise.jpg"

    [wallpaper.last]
    path = "/home/azea/MyNixConfig/Wallpaper/earth_rise.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/azea/MyNixConfig/Wallpaper/earth_rise.jpg"

[widget.clipboard]
enabled = false

[widget.clock]
font_weight = 700

[widget.launcher]
enabled = false

[widget.wallpaper]
enabled = false
